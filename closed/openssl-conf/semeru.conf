my %targets = (
	"semeru"            => { shlib_variant => "-semeru", template => 1 },
	"semeru-linux"      => {
		inherit_from        => [ "semeru" ],
		shared_extension    => ".so",
		shared_ldflag       => add("-Wl,-rpath,'\$\$'ORIGIN"),
		template            => 1
	},
	# Provides the darwin-specific link flags for producing a dylib with its
	# install name baked as "@rpath/<name>" so dyld resolves it at runtime
	# relative to the loading binary.  No post-build install_name_tool fixup needed.
	#
	# shared_ldflag carries the full darwin link flags because shared_target is set
	# to "semeru-darwin-shared" on the leaf targets (no entry in shared-info.pl),
	# so Configure does not merge darwin-shared's flags on top:
	#   -dynamiclib                        required to produce a dylib
	#   -current/compatibility_version     standard darwin ABI versioning
	#   -Wl,-rpath,@loader_path/           embeds a relative rpath so any binary
	#                                      linking against us finds it at runtime
	# shared_sonameflag => "-install_name \@rpath/" causes unix-Makefile.tmpl to
	# append basename($full), yielding "-install_name @rpath/libcrypto-semeru.dylib".
	#
	# shared_extension and shared_target are NOT set here — darwin-common also
	# defines shared_extension, so setting it in an intermediate template would
	# cause the default combiner to concatenate both values.  They are set as
	# plain strings on each leaf target (semeru-oa64, semeru-or64) instead.
	"semeru-darwin"     => {
		inherit_from        => [ "semeru" ],
		shared_ldflag       => add("-dynamiclib",
		                          "-current_version \$(SHLIB_VERSION_NUMBER)",
		                          "-compatibility_version \$(SHLIB_VERSION_NUMBER)",
		                          "-Wl,-rpath,\@loader_path/"),
		shared_sonameflag   => "-install_name \@rpath/",
		template            => 1
	},
	# AIX has no $ORIGIN equivalent; use aix-solib packaging (plain .so files
	# rather than archive wrappers) so the runtime loader can resolve the
	# library through LIBPATH set by the JDK launcher.
	#
	# shared_extension and shared_target cannot be set here because aix64-cc and
	# aix64-clang also define shared_extension — the default combiner would
	# concatenate both values.  They are set as plain strings on each leaf target
	# instead, which forces a clean override regardless of inherited values.
	"semeru-aix"        => {
		inherit_from        => [ "semeru" ],
		shared_ldflag       => add("-Wl,-blibpath:/usr/lib:/lib"),
		template            => 1
	},

	# shared_extension => ".so" overrides aix64-cc/aix64-clang's
	# "64.so.\$(SHLIB_VERSION_NUMBER)" — produces libcrypto-semeru.so with no 64
	# infix and no version suffix, matching what NativeCrypto.c loads.
	# shared_target => "aix-solib" produces plain .so files (not archive-wrapped).
	# Both must be plain strings on the leaf target to win over inherited values.
	"semeru-ap64"       => { inherit_from => [ "aix64-cc",    "semeru-aix" ], shared_target => "aix-solib", shared_extension => ".so" },
	"semeru-ap64-clang" => { inherit_from => [ "aix64-clang", "semeru-aix" ], shared_target => "aix-solib", shared_extension => ".so" },

	# shared_extension => ".dylib" overrides darwin-common's
	# ".\$(SHLIB_VERSION_NUMBER).dylib" — produces libcrypto-semeru.dylib with no
	# version suffix, matching what NativeCrypto.c loads.
	# shared_target => "semeru-darwin-shared" keeps Configure from merging
	# darwin-shared's shared_sonameflag on top of semeru-darwin's.
	"semeru-oa64"       => { inherit_from => [ "darwin64-x86_64-cc", "semeru-darwin" ], shared_target => "semeru-darwin-shared", shared_extension => ".dylib" },
	"semeru-or64"       => { inherit_from => [ "darwin64-arm64-cc",  "semeru-darwin" ], shared_target => "semeru-darwin-shared", shared_extension => ".dylib" },
	# The name must start with "VC-", otherwise Windows builds fail.
	"VC-wa64"           => { inherit_from => [ "VC-WIN64A" ] },
	"semeru-xa64"       => { inherit_from => [ "semeru-linux", "linux-x86_64" ] },
	"semeru-xl64"       => { inherit_from => [ "semeru-linux", "linux-ppc64le" ] },
	"semeru-xr64"       => { inherit_from => [ "semeru-linux", "linux-aarch64" ] },
	"semeru-xv64"       => { inherit_from => [ "semeru-linux", "linux64-riscv64" ] },
	"semeru-xz64"       => { inherit_from => [ "semeru-linux", "linux64-s390x" ] },
);
